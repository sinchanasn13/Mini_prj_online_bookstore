# Server Configuration
server.port=8080

# H2 Database Configuration (in-memory, no setup required)
spring.datasource.url=jdbc:h2:mem:bookstoredb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (access at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Initialize schema on startup
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# Logging
logging.level.com.bookstore=DEBUG
logging.level.org.springframework.jdbc=DEBUG

# Application name
spring.application.name=online-bookstore

# Thymeleaf
spring.thymeleaf.cache=false
